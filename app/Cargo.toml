[package]
name = "murmur"
version = "0.1.0"
edition = "2024"
description = "A tiny native dictation companion for Claude"
authors = ["Akshay Reddy Gujjula"]
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts"] }
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
anyhow = "1"
arboard = "3.7"
tray-icon = { version = "0.26", default-features = false }
winreg = "0.56"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_Graphics_Dwm",
  "Win32_Security",
] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
